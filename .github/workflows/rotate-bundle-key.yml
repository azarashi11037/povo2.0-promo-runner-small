name: Rotate isolated runner bundle key

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: povo-session-state
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Decrypt with the migration key
        env:
          POVO_BUNDLE_KEY: ${{ secrets.POVO_BUNDLE_KEY }}
          POVO_DATA_DIR: ${{ runner.temp }}/povo-rotation
        run: |
          set -euo pipefail
          python tools/session_bundle.py unpack \
            --input state/session.enc \
            --data-dir "$POVO_DATA_DIR"
      - name: Re-encrypt with the final isolated key
        env:
          POVO_BUNDLE_KEY: ${{ secrets.POVO_FINAL_BUNDLE_KEY }}
          POVO_DATA_DIR: ${{ runner.temp }}/povo-rotation
        run: |
          set -euo pipefail
          python tools/session_bundle.py pack \
            --data-dir "$POVO_DATA_DIR" \
            --output state/session.enc
      - name: Commit final-key ciphertext
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force state/session.enc
          git commit -m "Rotate isolated povo2.0 runner bundle key"
          git push
