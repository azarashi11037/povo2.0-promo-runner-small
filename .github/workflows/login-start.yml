name: Start povo2.0 email login

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: povo-session-state
  cancel-in-progress: false

jobs:
  send-email-otp:
    runs-on: ubuntu-latest
    env:
      POVO_BUNDLE_KEY: ${{ secrets.POVO_BUNDLE_KEY }}
      POVO_LOGIN_EMAIL: ${{ secrets.POVO_LOGIN_EMAIL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Send OTP and encrypt the short-lived challenge
        run: python tools/login_session.py start --output state/login.enc
      - name: Commit ciphertext only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force state/login.enc
          git commit -m "Store encrypted povo2.0 login challenge"
          git push
