name: Import encrypted povo2.0 session

on:
  workflow_dispatch:
    inputs:
      next_due_at:
        description: "Next due time, for example 2026-09-06T16:17:00+09:00"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: povo-session-state
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    env:
      POVO_BUNDLE_KEY: ${{ secrets.POVO_BUNDLE_KEY }}
      POVO_CREDENTIALS_B64: ${{ secrets.POVO_CREDENTIALS_B64 }}
      POVO_DEVICE_B64: ${{ secrets.POVO_DEVICE_B64 }}
      POVO_PROMO_CODE: ${{ secrets.POVO_PROMO_CODE }}
      NEXT_DUE_AT: ${{ inputs.next_due_at }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Prepare session files from repository secrets
        run: |
          set -euo pipefail
          private_dir="$RUNNER_TEMP/povo-import"
          install -d -m 700 "$private_dir"
          python tools/import_session.py \
            --data-dir "$private_dir" \
            --next-due-at "$NEXT_DUE_AT"
          python povo_api.py \
            --credentials "$private_dir/credentials.xml" \
            --device "$private_dir/device.xml" \
            inspect
          python tools/session_bundle.py pack \
            --data-dir "$private_dir" \
            --output state/session.enc
          find "$private_dir" -type f -exec chmod 600 {} +
      - name: Commit ciphertext only
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --force state/session.enc
          if ! git diff --cached --quiet; then
            git commit -m "Update encrypted povo2.0 session state"
            git push
          fi
