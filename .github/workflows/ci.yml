name: CI

on:
  push:
    paths-ignore:
      - "state/session.enc"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile povo_api.py povo_worker.py povo_web.py healthcheck.py tools/*.py
      - run: python tools/build_multilingual_readme.py --check
      - run: python -m unittest discover -s tests -v
      - run: docker compose config
      - run: docker build -t povo-promo-automation:test .
