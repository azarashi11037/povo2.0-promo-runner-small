name: povo-promo-automation

x-povo-common: &povo-common
  build:
    context: .
  image: ${POVO_IMAGE:-local/povo-promo-automation:0.1.0}
  restart: unless-stopped
  environment:
    TZ: Asia/Tokyo
    POVO_DATA_DIR: /data
    POVO_ENABLE_REDEMPTION: ${POVO_ENABLE_REDEMPTION:-0}
  volumes:
    - ${POVO_HOST_DATA_DIR:-./data}:/data
  read_only: true
  tmpfs:
    - /tmp:size=16m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  pids_limit: 64
  logging:
    driver: json-file
    options:
      max-size: 5m
      max-file: "3"

services:
  povo-worker:
    <<: *povo-common
    command: ["python", "/app/povo_worker.py"]
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py", "worker"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  povo-web:
    <<: *povo-common
    command: ["python", "/app/povo_web.py"]
    mem_limit: 128m
    cpus: 0.25
    depends_on:
      povo-worker:
        condition: service_healthy
    ports:
      - "${POVO_BIND_ADDRESS:-127.0.0.1}:${POVO_WEB_PORT:-17820}:8080"
    healthcheck:
      test: ["CMD", "python", "/app/healthcheck.py", "web"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
